<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./src/assets/logos/switchlite.png" />
    <title>SwitchLite · LLM 供应商一键切换</title>
    <script>
      // 首帧前应用主题，避免闪烁（与 src/theme.ts 逻辑保持一致）
      try {
        var m = localStorage.getItem('switchlite-theme') || 'system';
        var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
